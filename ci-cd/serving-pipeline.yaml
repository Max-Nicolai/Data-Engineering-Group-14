steps:
  # 1. Download the model from Cloud Storage
  - name: 'gcr.io/cloud-builders/gsutil'
    args: ['cp', 'gs://${_MODEL_BUCKET}/models/model.pkl', 'serving/api/model.pkl']

  # 2. Build the Prediction API Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/prediction-api:latest', 'serving/api']

  # 3. Push the API Image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/prediction-api:latest']

  # 4. Deploy the API to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: 
      - 'run'
      - 'deploy'
      - 'housing-prediction-api'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/prediction-api:latest'
      - '--region'
      - '${_REGION}'
      - '--allow-unauthenticated'
      - '--port'
      - '5000'

  # 5. Build the Prediction UI Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/prediction-ui:latest', 'serving/ui']

  # 6. Push the UI Image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/prediction-ui:latest']

  # 7. Deploy the UI to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        # Extract the deployed API URL
        API_URL=$(gcloud run services describe housing-prediction-api --region ${_REGION} --format 'value(status.url)')/predict

        # Deploy UI and pass the API URL as an environment variable
        gcloud run deploy housing-prediction-ui \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/prediction-ui:latest \
          --region ${_REGION} \
          --allow-unauthenticated \
          --port 5001 \
          --set-env-vars PREDICTOR_API=$$API_URL
options:
  logging: CLOUD_LOGGING_ONLY
