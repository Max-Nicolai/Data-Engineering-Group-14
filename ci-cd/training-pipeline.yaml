steps:
  # 1. Build the Model Trainer Component Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/model-trainer:latest', 'pipeline/components/model_trainer']

  # 2. Push the Image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/model-trainer:latest']

  # 3. Compile the pipeline and run it on Vertex AI (pipeline/submit_pipeline.py)
  - name: 'python:3.11-slim'
    entrypoint: 'bash'
    dir: 'pipeline'
    env:
      - 'PROJECT_ID=$PROJECT_ID'
      - 'REGION=${_REGION}'
      - 'MODEL_BUCKET=${_MODEL_BUCKET}'
    args: ['-c', 'pip install --no-cache-dir kfp google-cloud-aiplatform && python submit_pipeline.py']
    
  # 4. Publish the compiled pipeline (versioned by Git commit)
  - name: 'gcr.io/cloud-builders/gsutil'
    args: ['cp', 'pipeline/pipeline.yaml', 'gs://${_MODEL_BUCKET}/pipelines/training_pipeline-${SHORT_SHA}.yaml']

options:
  logging: CLOUD_LOGGING_ONLY
