# PIPELINE DEFINITION
# Name: california-housing-training-pipeline
# Description: Trains a RandomForest model on California Housing data and saves it to GCS
# Inputs:
#    bucket_name: str [Default: '<YOUR_MODELS_BUCKET_NAME>']
#    model_path: str [Default: 'model.pkl']
components:
  comp-train-model-component:
    executorLabel: exec-train-model-component
    inputDefinitions:
      parameters:
        bucket_name:
          parameterType: STRING
        model_path:
          parameterType: STRING
deploymentSpec:
  executors:
    exec-train-model-component:
      container:
        args:
        - --bucket_name
        - '{{$.inputs.parameters[''bucket_name'']}}'
        - --model_path
        - '{{$.inputs.parameters[''model_path'']}}'
        command:
        - python
        - src/component.py
        image: us-central1-docker.pkg.dev/<YOUR_PROJECT_ID>/labrepo/model-trainer:latest
pipelineInfo:
  description: Trains a RandomForest model on California Housing data and saves it
    to GCS
  name: california-housing-training-pipeline
root:
  dag:
    tasks:
      train-model-component:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train-model-component
        inputs:
          parameters:
            bucket_name:
              componentInputParameter: bucket_name
            model_path:
              componentInputParameter: model_path
        taskInfo:
          name: train-model-component
  inputDefinitions:
    parameters:
      bucket_name:
        defaultValue: <YOUR_MODELS_BUCKET_NAME>
        isOptional: true
        parameterType: STRING
      model_path:
        defaultValue: model.pkl
        isOptional: true
        parameterType: STRING
schemaVersion: 2.1.0
sdkVersion: kfp-2.17.0
